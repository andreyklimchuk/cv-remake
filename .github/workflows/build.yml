# Builds the single-file game (dist/play.html) on every push and publishes it:
#  - Releases → "latest" → cv-remake-play.zip (direct download)
#  - Actions → run → Artifacts → cv-remake-play
name: Build play.html
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore binary assets (binary/*.b64 -> GLB/textures)
        run: node scripts/restore-binaries.mjs > /dev/null
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Zip
        run: cd dist && zip -9 -q ../cv-remake-play.zip play.html
      - uses: actions/upload-artifact@v4
        with:
          name: cv-remake-play
          path: cv-remake-play.zip
          retention-days: 30
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cv-remake-play.zip --title "Последняя сборка (${GITHUB_SHA::7})" --notes "Автосборка из коммита ${GITHUB_SHA}. Распакуйте и откройте play.html в Chrome/Edge." --latest
